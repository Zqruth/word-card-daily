<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词思维导图 · 每日学习卡</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px 48px;background:#f4f5f7;color:#1f2328;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:16px;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:19px;font-weight:700;margin:0 0 4px}
  .sub{font-size:13px;color:#57606a;margin:0 0 20px}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
  li{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:13px 15px;display:flex;gap:13px;align-items:center}
  li img{width:56px;height:74px;object-fit:cover;object-position:top;border:1px solid #e3e6ea;border-radius:7px;flex:0 0 auto}
  li .t{flex:1 1 auto;min-width:0}
  li .d{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#b45309;letter-spacing:.5px}
  li .w{font-size:16px;font-weight:700;margin:1px 0 2px}
  li .m{font-size:12.5px;color:#57606a}
  li .go{font-size:12.5px;color:#b45309;text-decoration:none;white-space:nowrap;border:1px solid #f0dcc0;background:#fdf7ef;padding:6px 11px;border-radius:8px}
  .tip{margin-top:20px;font-size:12.5px;color:#8b949e;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>单词思维导图 · 每日学习卡</h1>
  <p class="sub">每天 2 个母词，记一个会一串。点「打开跟读」可听发音。</p>
  <ul id="list"></ul>
  <p class="tip">本页为学习卡索引，图片可长按保存打印成 A4 小记录贴。</p>
</div>
<script>
const CARDS = [
  ["day01-care","DAY 01","care 词族","-ful / -less：一有一无"],
  ["day02-help","DAY 02","help 词族","再练 -ful / -less"],
  ["day03-teach","DAY 03","teach 词族","动词 + -er：做事的人"],
  ["day03b-farm","DAY 03","farm 词族","再练 -er"],
  ["day04-play","DAY 04","play 词族","再练 -er：玩球的人"],
  ["day04b-read","DAY 04","read 词族","再练 -er：读书的人"],
  ["day05-happy","DAY 05","happy 词族","un-：小帽子反意思"],
  ["day05b-kind","DAY 05","kind 词族","再练 un-"],
  ["day06-lock","DAY 06","lock 词族","再练 un-：开锁"],
  ["day06b-fair","DAY 06","fair 词族","再练 un-：公平"],
  ["day07-rain","DAY 07","rain 词族","词 + -y：天气词"],
  ["day07b-wind","DAY 07","wind 词族","再练 -y：风"],
  ["day08-sun","DAY 08","sun 词族","再练 -y：短词先双写"],
  ["day08b-cloud","DAY 08","cloud 词族","再练 -y：一有一无"],
  ["day09-work","DAY 09","work 词族","复盘 -er：做事的人"],
  ["day09b-thank","DAY 09","thank 词族","复盘 -ful：感谢"],
  ["day10-safe","DAY 10","safe 词族","复盘：帽子尾巴全用上"],
  ["day10b-health","DAY 10","health 词族","复盘：L1 毕业"],
  ["day11-quick","DAY 11","quick 词族","形容词 + -ly：怎样地"],
  ["day11b-slow","DAY 11","slow 词族","再练 -ly"],
  ["day12-loud","DAY 12","loud 词族","再练 -ly：大声"],
  ["day12b-quiet","DAY 12","quiet 词族","再练 -ly：安静"],
  ["day13-build","DAY 13","build 词族","re-：再一次"],
  ["day13b-write","DAY 13","write 词族","再练 re-：写"],
  ["day14-turn","DAY 14","turn 词族","再练 re-：转"],
  ["day14b-new","DAY 14","new 词族","再练 re-：更新"],
  ["day15-feel","DAY 15","feel 词族","-ing / -ed：这件事"],
  ["day15b-interest","DAY 15","interest 词族","-ing 事 -ed 人"],
  ["day16-mean","DAY 16","mean 词族","再练 -ing：意思"],
  ["day16b-paint","DAY 16","paint 词族","再练 -ing / -er"],
  ["day17-easy","DAY 17","easy 词族","复习日：y 变 i 加 -ly"],
  ["day17b-busy","DAY 17","busy 词族","复习日：-ly 收尾"],
  ["day18-home","DAY 18","home 词族","新概念：复合词"],
  ["day18b-school","DAY 18","school 词族","再练复合词"],
  ["day19-fear","DAY 19","fear 词族","-ful / -less 升级"],
  ["day19b-power","DAY 19","power 词族","再练 -ful / -less"],
  ["day20-careful","DAY 20","careful 词族","复盘：尾巴叠戴"],
  ["day20b-use","DAY 20","use 词族","复盘：一张卡串全规律"],
  ["day21-harm","DAY 21","harm 词族","-ful / -less 再练"],
  ["day21b-pain","DAY 21","pain 词族","再练 -ful / -less"],
  ["day22-hope","DAY 22","hope 词族","复习：尾巴叠两层"],
  ["day22b-colour","DAY 22","colour 词族","-ful / -less 用在颜色"],
  ["day23-sing","DAY 23","sing 词族","回顾 -er：做事的人"],
  ["day23b-drive","DAY 23","drive 词族","再练 -er：司机"],
  ["day24-book","DAY 24","book 词族","复合词再练"],
  ["day24b-room","DAY 24","room 词族","复合词：房间"],
  ["day25-snow","DAY 25","snow 词族","回顾 -y：天气"],
  ["day25b-salt","DAY 25","salt 词族","-y：味道"],
  ["day26-usual","DAY 26","usual 词族","回顾 un-：不寻常"],
  ["day26b-true","DAY 26","true 词族","再练 un-：真实"],
  ["day27-care","DAY 27","care 词族","综合复习：四张尾巴"],
  ["day27b-help","DAY 27","help 词族","综合复习：老朋友"],
  ["day28-learn","DAY 28","learn 词族","复习 -ing / -er"],
  ["day28b-draw","DAY 28","draw 词族","再练 -ing / -er"],
  ["day29-bad","DAY 29","bad 词族","小新概念：不规则比较"],
  ["day29b-good","DAY 29","good 词族","好 → well"],
  ["day30-happy","DAY 30","happy 词族","阶段大复习"],
  ["day30b-work","DAY 30","work 词族","阶段大复习：复合词"]
];
document.getElementById("list").innerHTML = CARDS.map(c =>
  `<li><img src="${c[0]}.png" alt="${c[2]}"><div class="t">
    <div class="d">${c[1]}</div><div class="w">${c[2]}</div><div class="m">${c[3]}</div>
  </div><a class="go" href="${c[0]}.html">打开跟读</a></li>`).join("");
</script>
</body>
</html>
